version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: decozr-postgres
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: decozr
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: decozr_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U decozr -d decozr_db']
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: decozr-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: decozr-minio
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      MINIO_ROOT_USER: decozr
      MINIO_ROOT_PASSWORD: password123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: decozr-backend
    ports:
      - '3000:3000'
    environment:
      - DATABASE_URL=postgresql://decozr:password123@postgres:5432/decozr_db?schema=public
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=super-secret-jwt-key
      - JWT_REFRESH_SECRET=super-secret-refresh-key
      - PORT=3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
